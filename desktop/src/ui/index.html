<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health OS - Hospital Management</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        .sidebar {
            transition: transform 0.3s ease-in-out;
        }
        
        .sidebar.collapsed {
            transform: translateX(-100%);
        }
        
        .main-content {
            transition: margin-left 0.3s ease-in-out;
        }
        
        .main-content.expanded {
            margin-left: 0;
        }
        
        .card {
            transition: all 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .stat-card.green {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
        }
        
        .stat-card.blue {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
        }
        
        .stat-card.orange {
            background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%);
        }
        
        .modal {
            backdrop-filter: blur(5px);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .table-hover:hover {
            background-color: #f8f9ff;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // Main App Component
        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentView, setCurrentView] = useState('dashboard');
            const [sidebarOpen, setSidebarOpen] = useState(true);
            const [showLicenceModal, setShowLicenceModal] = useState(false);
            const [loading, setLoading] = useState(false);
            const [dashboardData, setDashboardData] = useState(null);
            const [patients, setPatients] = useState([]);
            const [appointments, setAppointments] = useState([]);
            const [invoices, setInvoices] = useState([]);

            useEffect(() => {
                checkLicenceStatus();
                if (isLoggedIn) {
                    loadDashboardData();
                }
            }, [isLoggedIn]);

            const checkLicenceStatus = async () => {
                try {
                    const result = await window.__TAURI__.invoke('check_licence_status');
                    if (result && result.is_valid) {
                        setIsLoggedIn(true);
                    } else {
                        setShowLicenceModal(true);
                    }
                } catch (error) {
                    console.error('Error checking licence:', error);
                    setShowLicenceModal(true);
                }
            };

            const activateLicence = async (licenceKey) => {
                try {
                    setLoading(true);
                    const hardwareFingerprint = await window.__TAURI__.invoke('get_hardware_fingerprint');
                    const result = await window.__TAURI__.invoke('activate_licence', {
                        licenceKey: licenceKey,
                        hardwareFingerprint: hardwareFingerprint
                    });
                    
                    if (result.is_valid) {
                        setIsLoggedIn(true);
                        setShowLicenceModal(false);
                        loadDashboardData();
                    } else {
                        alert('Invalid licence key: ' + result.validation_message);
                    }
                } catch (error) {
                    console.error('Error activating licence:', error);
                    alert('Failed to activate licence');
                } finally {
                    setLoading(false);
                }
            };

            const loadDashboardData = async () => {
                try {
                    setLoading(true);
                    const stats = await window.__TAURI__.invoke('get_dashboard_stats');
                    const patientsData = await window.__TAURI__.invoke('load_patients', { page: 1, limit: 10 });
                    const appointmentsData = await window.__TAURI__.invoke('load_appointments', { date: new Date().toISOString().split('T')[0] });
                    const invoicesData = await window.__TAURI__.invoke('load_invoices', { page: 1, limit: 10 });

                    setDashboardData(stats);
                    setPatients(patientsData.data || []);
                    setAppointments(appointmentsData.data || []);
                    setInvoices(invoicesData.data || []);
                } catch (error) {
                    console.error('Error loading dashboard data:', error);
                } finally {
                    setLoading(false);
                }
            };

            const Sidebar = () => (
                <div className={`sidebar fixed left-0 top-0 h-64 w-64 bg-gray-900 text-white z-40 ${sidebarOpen ? '' : 'collapsed'}`}>
                    <div className="p-6">
                        <h1 className="text-2xl font-bold text-blue-400">
                            <i className="fas fa-hospital mr-2"></i>
                            Health OS
                        </h1>
                        <p className="text-sm text-gray-400 mt-2">Hospital Management</p>
                    </div>
                    
                    <nav className="mt-8">
                        <button
                            onClick={() => setCurrentView('dashboard')}
                            className={`w-full text-left px-6 py-3 hover:bg-gray-800 transition-colors ${currentView === 'dashboard' ? 'bg-gray-800 border-l-4 border-blue-400' : ''}`}
                        >
                            <i className="fas fa-tachometer-alt mr-3"></i>
                            Dashboard
                        </button>
                        
                        <button
                            onClick={() => setCurrentView('patients')}
                            className={`w-full text-left px-6 py-3 hover:bg-gray-800 transition-colors ${currentView === 'patients' ? 'bg-gray-800 border-l-4 border-blue-400' : ''}`}
                        >
                            <i className="fas fa-users mr-3"></i>
                            Patients
                        </button>
                        
                        <button
                            onClick={() => setCurrentView('appointments')}
                            className={`w-full text-left px-6 py-3 hover:bg-gray-800 transition-colors ${currentView === 'appointments' ? 'bg-gray-800 border-l-4 border-blue-400' : ''}`}
                        >
                            <i className="fas fa-calendar-alt mr-3"></i>
                            Appointments
                        </button>
                        
                        <button
                            onClick={() => setCurrentView('billing')}
                            className={`w-full text-left px-6 py-3 hover:bg-gray-800 transition-colors ${currentView === 'billing' ? 'bg-gray-800 border-l-4 border-blue-400' : ''}`}
                        >
                            <i className="fas fa-file-invoice-dollar mr-3"></i>
                            Billing
                        </button>
                        
                        <button
                            onClick={() => setCurrentView('reports')}
                            className={`w-full text-left px-6 py-3 hover:bg-gray-800 transition-colors ${currentView === 'reports' ? 'bg-gray-800 border-l-4 border-blue-400' : ''}`}
                        >
                            <i className="fas fa-chart-bar mr-3"></i>
                            Reports
                        </button>
                        
                        <button
                            onClick={() => setCurrentView('settings')}
                            className={`w-full text-left px-6 py-3 hover:bg-gray-800 transition-colors ${currentView === 'settings' ? 'bg-gray-800 border-l-4 border-blue-400' : ''}`}
                        >
                            <i className="fas fa-cog mr-3"></i>
                            Settings
                        </button>
                    </nav>
                </div>
            );

            const Dashboard = () => (
                <div className="p-6">
                    <h2 className="text-3xl font-bold mb-6">Dashboard</h2>
                    
                    {loading ? (
                        <div className="flex justify-center items-center h-64">
                            <div className="loading-spinner"></div>
                        </div>
                    ) : (
                        <div>
                            {/* Stats Cards */}
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                                <div className="stat-card text-white p-6 rounded-lg shadow-lg">
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <p className="text-white/80 text-sm">Total Patients</p>
                                            <p className="text-3xl font-bold">{dashboardData?.total_patients || 0}</p>
                                        </div>
                                        <i className="fas fa-users text-3xl text-white/50"></i>
                                    </div>
                                </div>
                                
                                <div className="stat-card green text-white p-6 rounded-lg shadow-lg">
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <p className="text-white/80 text-sm">Today's Appointments</p>
                                            <p className="text-3xl font-bold">{dashboardData?.today_appointments || 0}</p>
                                        </div>
                                        <i className="fas fa-calendar-check text-3xl text-white/50"></i>
                                    </div>
                                </div>
                                
                                <div className="stat-card blue text-white p-6 rounded-lg shadow-lg">
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <p className="text-white/80 text-sm">Pending Invoices</p>
                                            <p className="text-3xl font-bold">{dashboardData?.pending_invoices || 0}</p>
                                        </div>
                                        <i className="fas fa-file-invoice text-3xl text-white/50"></i>
                                    </div>
                                </div>
                                
                                <div className="stat-card orange text-white p-6 rounded-lg shadow-lg">
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <p className="text-white/80 text-sm">Monthly Revenue</p>
                                            <p className="text-3xl font-bold">${dashboardData?.monthly_revenue || 0}</p>
                                        </div>
                                        <i className="fas fa-dollar-sign text-3xl text-white/50"></i>
                                    </div>
                                </div>
                            </div>

                            {/* Recent Patients */}
                            <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                                <h3 className="text-xl font-semibold mb-4">Recent Patients</h3>
                                <div className="overflow-x-auto">
                                    <table className="w-full">
                                        <thead>
                                            <tr className="border-b">
                                                <th className="text-left p-2">Patient ID</th>
                                                <th className="text-left p-2">Name</th>
                                                <th className="text-left p-2">Status</th>
                                                <th className="text-left p-2">Admission Date</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {patients.slice(0, 5).map(patient => (
                                                <tr key={patient.id} className="border-b table-hover">
                                                    <td className="p-2">{patient.patient_id}</td>
                                                    <td className="p-2">{patient.name}</td>
                                                    <td className="p-2">
                                                        <span className={`px-2 py-1 rounded text-xs ${
                                                            patient.status === 'active' ? 'bg-green-100 text-green-800' :
                                                            patient.status === 'discharged' ? 'bg-blue-100 text-blue-800' :
                                                            'bg-gray-100 text-gray-800'
                                                        }`}>
                                                            {patient.status}
                                                        </span>
                                                    </td>
                                                    <td className="p-2">{new Date(patient.admission_date).toLocaleDateString()}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {/* Today's Appointments */}
                            <div className="bg-white rounded-lg shadow-lg p-6">
                                <h3 className="text-xl font-semibold mb-4">Today's Appointments</h3>
                                <div className="space-y-4">
                                    {appointments.slice(0, 3).map(appointment => (
                                        <div key={appointment.id} className="border-l-4 border-blue-400 pl-4 py-2">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <p className="font-semibold">{appointment.patient_name}</p>
                                                    <p className="text-sm text-gray-600">{appointment.appointment_type}</p>
                                                    <p className="text-sm text-gray-500">
                                                        <i className="fas fa-clock mr-1"></i>
                                                        {new Date(appointment.start_time).toLocaleTimeString()}
                                                    </p>
                                                </div>
                                                <span className={`px-2 py-1 rounded text-xs ${
                                                    appointment.status === 'scheduled' ? 'bg-yellow-100 text-yellow-800' :
                                                    appointment.status === 'confirmed' ? 'bg-green-100 text-green-800' :
                                                    'bg-gray-100 text-gray-800'
                                                }`}>
                                                    {appointment.status}
                                                </span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );

            const Patients = () => (
                <div className="p-6">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-3xl font-bold">Patients</h2>
                        <button className="btn-primary text-white px-4 py-2 rounded-lg">
                            <i className="fas fa-plus mr-2"></i>
                            New Patient
                        </button>
                    </div>
                    
                    <div className="bg-white rounded-lg shadow-lg p-6">
                        <div className="overflow-x-auto">
                            <table className="w-full">
                                <thead>
                                    <tr className="border-b">
                                        <th className="text-left p-2">Patient ID</th>
                                        <th className="text-left p-2">Name</th>
                                        <th className="text-left p-2">Age</th>
                                        <th className="text-left p-2">Blood Type</th>
                                        <th className="text-left p-2">Status</th>
                                        <th className="text-left p-2">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {patients.map(patient => (
                                        <tr key={patient.id} className="border-b table-hover">
                                            <td className="p-2">{patient.patient_id}</td>
                                            <td className="p-2">{patient.name}</td>
                                            <td className="p-2">{patient.age}</td>
                                            <td className="p-2">{patient.blood_type || 'N/A'}</td>
                                            <td className="p-2">
                                                <span className={`px-2 py-1 rounded text-xs ${
                                                    patient.status === 'active' ? 'bg-green-100 text-green-800' :
                                                    patient.status === 'discharged' ? 'bg-blue-100 text-blue-800' :
                                                    'bg-gray-100 text-gray-800'
                                                }`}>
                                                    {patient.status}
                                                </span>
                                            </td>
                                            <td className="p-2">
                                                <button className="text-blue-500 hover:text-blue-700 mr-2">
                                                    <i className="fas fa-eye"></i>
                                                </button>
                                                <button className="text-green-500 hover:text-green-700 mr-2">
                                                    <i className="fas fa-edit"></i>
                                                </button>
                                                <button className="text-red-500 hover:text-red-700">
                                                    <i className="fas fa-trash"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );

            const LicenceModal = () => (
                <div className="modal fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-lg p-8 max-w-md w-full mx-4">
                        <h2 className="text-2xl font-bold mb-6">Activate Licence</h2>
                        <p className="text-gray-600 mb-6">
                            Please enter your licence key to continue using Health OS Hospital Management System.
                        </p>
                        
                        <div className="mb-4">
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                Licence Key
                            </label>
                            <input
                                type="text"
                                id="licenceKey"
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                placeholder="Enter your licence key"
                            />
                        </div>
                        
                        <div className="flex justify-end space-x-4">
                            <button
                                onClick={() => setShowLicenceModal(false)}
                                className="px-4 py-2 text-gray-600 hover:text-gray-800"
                                disabled={loading}
                            >
                                Cancel
                            </button>
                            <button
                                onClick={() => {
                                    const licenceKey = document.getElementById('licenceKey').value;
                                    activateLicence(licenceKey);
                                }}
                                className="btn-primary text-white px-4 py-2 rounded-lg"
                                disabled={loading}
                            >
                                {loading ? (
                                    <div className="loading-spinner w-5 h-5 mr-2"></div>
                                ) : null}
                                Activate
                            </button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="flex h-screen bg-gray-100">
                    <Sidebar />
                    
                    <div className={`main-content flex-1 ${sidebarOpen ? 'ml-64' : 'ml-0 expanded'}`}>
                        <header className="bg-white shadow-sm">
                            <div className="flex items-center justify-between p-4">
                                <button
                                    onClick={() => setSidebarOpen(!sidebarOpen)}
                                    className="text-gray-500 hover:text-gray-700"
                                >
                                    <i className={`fas fa-${sidebarOpen ? 'times' : 'bars'}`}></i>
                                </button>
                                
                                <div className="flex items-center space-x-4">
                                    <span className="text-sm text-gray-600">
                                        <i className="fas fa-shield-alt mr-1"></i>
                                        Licensed
                                    </span>
                                    <button className="text-gray-500 hover:text-gray-700">
                                        <i className="fas fa-bell"></i>
                                    </button>
                                    <div className="relative">
                                        <button className="text-gray-500 hover:text-gray-700">
                                            <i className="fas fa-user-circle text-xl"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </header>
                        
                        <main className="flex-1 overflow-y-auto">
                            {currentView === 'dashboard' && <Dashboard />}
                            {currentView === 'patients' && <Patients />}
                            {/* Add other views as needed */}
                        </main>
                    </div>
                    
                    {showLicenceModal && <LicenceModal />}
                </div>
            );
        };

        // Render the app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
