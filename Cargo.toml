[workspace]
members = [
    # Services
    "services/api-gateway",
    "services/timeline-service", 
    "services/document-processor",
    "services/ai-report-service",
    "services/doctor-access-service",
    
    # Shared crates
    "crates/event-model",
    "crates/timeline-engine", 
    "crates/auth",
    "crates/storage",
    "crates/telemetry",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Health OS Team"]
license = "MIT"
homepage = "https://github.com/health-os/backend"
repository = "https://github.com/health-os/backend"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Web framework
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio", "uuid", "chrono", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Time/Date
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.14"

# Authentication
jsonwebtoken = "9.2"

# QR codes
qrcode = "0.14"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Async messaging
async-nats = "0.33"

# OpenTelemetry
opentelemetry = "0.21"
tracing-opentelemetry = "0.22"
opentelemetry-jaeger = "0.20"

# Testing
mockall = "0.12"

# Document processing
tesseract = "0.13"

# AI/ML
ollama-rs = "0.1"
