[package]
name = "health-os-demo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "demo"
path = "main.rs"

[[bin]]
name = "simple_demo"
path = "simple_demo.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
