[package]
name = "health-os-types"
version = "1.0.0"
edition = "2021"
description = "Semantic type definitions for Health OS healthcare platform"
authors = ["Health OS Team <team@healthos.app>"]
license = "MIT"
repository = "https://github.com/revitalyr/Personal_Health_OS"
keywords = ["healthcare", "medical", "semantic-types", "type-safety", "rust"]
categories = ["data-structures", "development-tools"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
validator = { version = "0.16", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
serde_json = "1.0"

[features]
default = ["std"]
std = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
