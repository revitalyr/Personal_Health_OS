[package]
name = "document-processor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
config = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-nats = { workspace = true }
futures-util = "0.3"

# Internal crates
ocr-processor = { path = "../../crates/ocr-processor" }
dicom-processor = { path = "../../crates/dicom-processor" }
nlp-processor = { path = "../../crates/nlp-processor" }

# File handling
mime = "0.3"
mime_guess = "2.0"
tempfile = "3.8"
image = "0.25"

# Storage & Database
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres"] }
# aws-sdk-s3 = "1.0"
# aws-config = "1.0"  # Temporarily commented out

# Internal crates
event-model = { path = "../../crates/event-model" }
storage = { path = "../../crates/storage" }
telemetry = { path = "../../crates/telemetry" }
auth = { path = "../../crates/auth" }
