name: Health OS Multi-Platform CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Backend Services Build & Test
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [
          "api-gateway",
          "timeline-service", 
          "document-processor",
          "ai-report-service",
          "doctor-access-service",
          "patient-management",
          "appointment-scheduling",
          "billing-invoicing",
          "licence-management"
        ]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
    
    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build service
      run: |
        cd services/${{ matrix.service }}
        cargo build --release
    
    - name: Run tests
      run: |
        cd services/${{ matrix.service }}
        cargo test --release
    
    - name: Build Docker image
      run: |
        cd services/${{ matrix.service }}
        docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ github.sha }} .
    
    - name: Push Docker image
      if: github.event_name != 'pull_request'
      run: |
        echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ github.sha }}

  # Android Client
  android:
    runs-on: ubuntu-latest
    needs: backend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
    
    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
    
    - name: Build Android app
      run: |
        cd clients/android
        ./gradlew assembleRelease
    
    - name: Run Android tests
      run: |
        cd clients/android
        ./gradlew testRelease
    
    - name: Upload Android APK
      uses: actions/upload-artifact@v3
      with:
        name: android-apk
        path: clients/android/app/build/outputs/apk/release/app-release.apk

  # iOS Client
  ios:
    runs-on: macos-latest
    needs: backend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Cache Swift Package Manager
      uses: actions/cache@v3
      with:
        path: clients/ios/.build
        key: ${{ runner.os }}-spm-${{ hashFiles('clients/ios/Package.swift') }}
    
    - name: Build iOS app
      run: |
        cd clients/ios
        swift build -c release
    
    - name: Run iOS tests
      run: |
        cd clients/ios
        swift test --enable-code-coverage
    
    - name: Build iOS archive
      run: |
        cd clients/ios
        xcodebuild -scheme HealthOS-HMS-App -configuration Release archive -archivePath build/HealthOS-HMS.xcarchive
    
    - name: Upload iOS build
      uses: actions/upload-artifact@v3
      with:
        name: ios-build
        path: clients/ios/build/HealthOS-HMS.xcarchive

  # Rust Desktop Client
  desktop-rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    needs: backend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
    
    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          clients/desktop-rust/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('clients/desktop-rust/Cargo.toml') }}
    
    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
    
    - name: Build Rust desktop app
      run: |
        cd clients/desktop-rust
        cargo tauri build
    
    - name: Run tests
      run: |
        cd clients/desktop-rust
        cargo test
    
    - name: Upload Rust desktop artifacts
      uses: actions/upload-artifact@v3
      with:
        name: desktop-rust-${{ matrix.os }}
        path: clients/desktop-rust/src-tauri/target/release/bundle/

  # C++ Desktop Client
  desktop-cpp:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    needs: backend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v1.14
      with:
        cmake-version: '3.20.x'
    
    - name: Setup Qt (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y qt6-base-dev qt6-tools-dev cmake build-essential
    
    - name: Setup Qt (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install qt6-base qt6-tools
    
    - name: Setup Qt (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install qt@6
    
    - name: Configure and build C++ desktop app
      run: |
        cd clients/desktop-cpp
        mkdir build
        cd build
        cmake ..
        cmake --build . --config Release
    
    - name: Upload C++ desktop artifacts
      uses: actions/upload-artifact@v3
      with:
        name: desktop-cpp-${{ matrix.os }}
        path: clients/desktop-cpp/build/

  # C# Desktop Client
  desktop-csharp:
    runs-on: windows-latest
    needs: backend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '7.0.x'
    
    - name: Restore dependencies
      run: |
        cd clients/desktop-csharp
        dotnet restore
    
    - name: Build C# desktop app
      run: |
        cd clients/desktop-csharp
        dotnet build --configuration Release
    
    - name: Run tests
      run: |
        cd clients/desktop-csharp
        dotnet test --configuration Release
    
    - name: Publish C# desktop app
      run: |
        cd clients/desktop-csharp
        dotnet publish --configuration Release --output publish/
    
    - name: Upload C# desktop artifacts
      uses: actions/upload-artifact@v3
      with:
        name: desktop-csharp
        path: clients/desktop-csharp/publish/

  # Python Desktop Client
  desktop-python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    needs: backend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('clients/desktop-python/requirements.txt') }}
    
    - name: Install dependencies
      run: |
        cd clients/desktop-python
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Run tests
      run: |
        cd clients/desktop-python
        python -m pytest tests/ || echo "No tests found"
    
    - name: Build Python desktop app
      run: |
        cd clients/desktop-python
        pyinstaller --onefile --windowed main.py
    
    - name: Upload Python desktop artifacts
      uses: actions/upload-artifact@v3
      with:
        name: desktop-python-${{ matrix.os }}
        path: clients/desktop-python/dist/

  # Web SPA Client
  web-spa:
    runs-on: ubuntu-latest
    needs: backend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: clients/web-spa/package-lock.json
    
    - name: Install dependencies
      run: |
        cd clients/web-spa
        npm ci
    
    - name: Run tests
      run: |
        cd clients/web-spa
        npm run test:unit || echo "No tests found"
    
    - name: Build Web SPA
      run: |
        cd clients/web-spa
        npm run build
    
    - name: Upload Web SPA artifacts
      uses: actions/upload-artifact@v3
      with:
        name: web-spa
        path: clients/web-spa/dist/

  # Security Scanning
  security:
    runs-on: ubuntu-latest
    needs: [backend, android, ios, desktop-rust, desktop-cpp, desktop-csharp, desktop-python, web-spa]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # Release Creation
  release:
    runs-on: ubuntu-latest
    needs: [backend, android, ios, desktop-rust, desktop-cpp, desktop-csharp, desktop-python, web-spa]
    if: github.event_name == 'release'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v3
    
    - name: Create release assets
      run: |
        mkdir -p release-assets
        
        # Create platform-specific packages
        tar -czf release-assets/health-os-android.apk -C android-apk .
        tar -czf release-assets/health-os-ios.tar.gz -C ios-build .
        tar -czf release-assets/health-os-desktop-rust-linux.tar.gz -C desktop-rust-ubuntu-latest .
        tar -czf release-assets/health-os-desktop-rust-windows.tar.gz -C desktop-rust-windows-latest .
        tar -czf release-assets/health-os-desktop-rust-macos.tar.gz -C desktop-rust-macos-latest .
        tar -czf release-assets/health-os-desktop-cpp-linux.tar.gz -C desktop-cpp-ubuntu-latest .
        tar -czf release-assets/health-os-desktop-cpp-windows.tar.gz -C desktop-cpp-windows-latest .
        tar -czf release-assets/health-os-desktop-cpp-macos.tar.gz -C desktop-cpp-macos-latest .
        tar -czf release-assets/health-os-desktop-csharp.tar.gz -C desktop-csharp .
        tar -czf release-assets/health-os-desktop-python-linux.tar.gz -C desktop-python-ubuntu-latest .
        tar -czf release-assets/health-os-desktop-python-windows.tar.gz -C desktop-python-windows-latest .
        tar -czf release-assets/health-os-desktop-python-macos.tar.gz -C desktop-python-macos-latest .
        tar -czf release-assets/health-os-web-spa.tar.gz -C web-spa .
    
    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        files: release-assets/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deployment
  deploy:
    runs-on: ubuntu-latest
    needs: [backend, android, ios, desktop-rust, desktop-cpp, desktop-csharp, desktop-python, web-spa]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment"
        # Add deployment scripts here
    
    - name: Run integration tests
      run: |
        echo "Running integration tests"
        # Add integration test scripts here
