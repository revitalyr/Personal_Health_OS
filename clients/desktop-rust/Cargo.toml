[package]
name = "health-os-hms"
version = "1.0.0"
edition = "2021"
description = "Health OS Hospital Management System Desktop Client"
authors = ["Health OS Team <team@healthos.app>"]
license = "MIT"
repository = "https://github.com/revitalyr/Personal_Health_OS"
homepage = "https://github.com/revitalyr/Personal_Health_OS"
keywords = ["healthcare", "hospital", "medical", "desktop", "rust", "tauri"]

[dependencies]
# GUI Framework
tauri = { version = "1.4", features = ["api-all", "icon-png", "system-tray"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async Runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP Client
reqwest = { version = "0.11", features = ["json", "stream"] }

# Time and Date
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Cryptography
sha2 = "0.10"
rsa = "0.9"
rand = "0.8"
base64 = "0.21"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

# Configuration
config = "0.13"
dirs = "5.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# QR Code
qrcode = "0.14"
image = "0.24"

# Charts
plotters = { version = "0.3", features = ["svg_backend"] }

# File System
tauri-plugin-fs = { version = "1.0" }

# Notifications
tauri-plugin-notification = { version = "1.0" }

# System Information
sysinfo = "0.30"

# Serialization
bincode = "1.3"

[build-dependencies]
tauri-build = { version = "1.4", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "health-os-hms"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.release.package."*"]
opt-level = 3

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "1.0" }
